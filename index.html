<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Street Cai</title>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="loading">CARGANDO...</div>
  </div>
  <div id="sys">
    <button id="btn-pause" aria-label="Pausa">II</button>
    <button id="btn-coin" aria-label="Añadir crédito" title="Añadir crédito (tecla 5)"><span class="coin"></span></button>
    <button id="btn-mute" aria-label="Quitar sonido" title="Quitar sonido">
      <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button id="btn-full" aria-label="Pantalla completa" title="Pantalla completa">
      <svg class="ic-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg class="ic-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
  </div>
  <div id="touch"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
